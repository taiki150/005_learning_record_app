services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: 501
        GROUP_ID: 20
    user: "501:20"
    ports:
      # Vite dev server (npm run dev) — must reach host localhost:5173 when public/hot exists
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - php_storage_logs:/var/www/html/storage/logs
      - php_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=learning_record_app
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: learning_record_app
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
  php_storage_logs:
  php_bootstrap_cache:
